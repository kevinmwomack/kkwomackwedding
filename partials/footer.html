  <!-- ===== FOOTER (partials/footer.html) ===== -->
  <footer class="site-footer">
    <p class="footer-script" data-field="coupleNames">{{Couple Names}}</p>
    <p class="footer-date">
      <span data-field="weddingDateDisplay">{{Wedding Date}}</span>
      &nbsp;&middot;&nbsp;
      <span data-field="venueName">{{Venue Name}}</span>
    </p>
    <p class="footer-hashtag" data-field="hashtag">{{#Hashtag}}</p>
    <p class="footer-contact">
      <a href="mailto:" data-href-field="contactEmail" data-field="contactEmail">{{contact email}}</a>
      <span data-hide-without-whatsapp>
        &nbsp;&middot;&nbsp;
        <a href="#" data-href-field="whatsapp" target="_blank" rel="noopener">WhatsApp</a>
      </span>
    </p>
  </footer>
