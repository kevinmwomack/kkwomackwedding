  <!-- ===== PASSWORD GATE (partials/password-gate.html) ===== -->
  <div id="password-gate" class="gate-overlay" role="dialog" aria-label="Site access">
    <div class="gate-card">
      <p class="gate-script" data-field="coupleNames">{{Couple Names}}</p>
      <h1 class="gate-title">[[title|You're Invited]]</h1>
      <p class="gate-subtitle" data-field="weddingDateDisplay">{{Wedding Date}}</p>
      <p class="gate-prompt">[[prompt|Enter the invitation code to access the site.]]</p>
      <form id="gate-form" autocomplete="off">
        <input
          type="password"
          id="gate-input"
          class="gate-input"
          placeholder="Invitation code"
          aria-label="Invitation code"
          aria-describedby="gate-error"
          autocomplete="off"
          autofocus
        />
        <button type="submit" class="gate-btn">Enter</button>
      </form>
      <p id="gate-error" class="gate-error" aria-live="polite"></p>
    </div>
  </div>
