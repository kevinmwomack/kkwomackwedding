<!DOCTYPE html>
<!--
  Invitation card design (5 x 7 in). setup/cards/render.js fills in:
    [data-field="KEY"]  any value from js/config.js (COUPLE_NAMES, WEDDING_DATE_DISPLAY, ...)
    [data-guest-name]   the guest's name (or displayName from js/guests.js); auto-shrinks to fit
    img[data-qr]        the QR code (the guest's personal link, or --qr)
    [data-site-text]    the address printed under the QR (from SITE_URL, or --site-text)
    [data-reply-by]     replaced by --reply-by if you pass it
  Edit the wording and styles here freely; colors and fonts come from
  css/theme.css, so the cards follow the site's theme.
  Open this file in a browser to see the design while you edit it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Invitation</title>
  <link rel="stylesheet" href="../../css/fonts.css" />
  <link rel="stylesheet" href="../../css/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #333; padding: 24px; font-family: var(--font-body); }
    .card {
      width: 5in; height: 7in; margin: 0 auto; position: relative;
      background: var(--bg); color: var(--ink); text-align: center;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 0.55in 0.5in 0.45in;
    }
    .card::before { content: ''; position: absolute; inset: 0.14in; border: 1px solid var(--accent-border); }
    .card::after  { content: ''; position: absolute; inset: 0.19in; border: 0.5px solid rgba(var(--accent-rgb), 0.2); }
    .eyebrow { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); }
    .names { font-family: var(--font-script); font-size: 40px; color: var(--primary-dark); line-height: 1.15; margin: 10px 0 6px; }
    .lead { font-family: var(--font-heading); font-style: italic; font-size: 15px; color: var(--muted); line-height: 1.45; }
    .rule { width: 90px; height: 1px; margin: 12px auto; background: linear-gradient(to right, transparent, var(--accent), transparent); }
    .date { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; }
    .time { font-family: var(--font-heading); font-size: 15px; margin-top: 4px; }
    .venue { font-family: var(--font-heading); font-size: 17px; margin-top: 10px; }
    .city { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .guest-label { font-family: var(--font-display); font-size: 8px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 5px; }
    .guest-name {
      margin: 0 auto; width: 3.4in; height: 30px; border-bottom: 1px solid var(--accent-border);
      font-family: var(--font-heading); font-size: 17px; white-space: nowrap; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px;
    }
    .reply { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: left; }
    .reply img { width: 0.95in; height: 0.95in; }
    .reply-by { font-family: var(--font-heading); font-size: 14px; }
    .site { font-family: var(--font-display); font-size: 9px; letter-spacing: 0.12em; color: var(--primary-dark); margin-top: 3px; }
    .reply-note { font-size: 9px; color: var(--muted); margin-top: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <p class="eyebrow">Together with their families</p>
      <p class="names" data-field="COUPLE_NAMES">Partner One &amp; Partner Two</p>
      <p class="lead">request the pleasure of your company<br />as they celebrate their marriage</p>
      <div class="rule"></div>
      <p class="date" data-field="WEDDING_DATE_DISPLAY">June 12, 2027</p>
      <p class="time">{{at half past four in the afternoon}}</p>
      <p class="venue" data-field="VENUE_NAME">Venue Name</p>
      <p class="city" data-field="VENUE_CITY">City, State</p>
    </div>
    <div>
      <p class="guest-label">Reserved for</p>
      <p class="guest-name" data-guest-name></p>
    </div>
    <div class="reply">
      <img data-qr alt="" />
      <div>
        <p class="reply-by" data-reply-by>{{Kindly reply by May 1, 2027}}</p>
        <p class="site" data-site-text>example.com</p>
        <p class="reply-note">Scan to RSVP, or visit the site</p>
      </div>
    </div>
  </div>
</body>
</html>
